random_forest:
  regression:
    candidates:
      - name: rf_reg_default
        n_estimators: 300
        max_depth: null
        min_samples_leaf: 1
        max_features: sqrt
        n_jobs: -1

      - name: rf_reg_regularized
        n_estimators: 300
        max_depth: 20
        min_samples_leaf: 2
        max_features: sqrt
        n_jobs: -1

      - name: rf_reg_shallow
        n_estimators: 200
        max_depth: 10
        min_samples_leaf: 5
        max_features: sqrt
        n_jobs: -1

  classification:
