      - name: xgb_reg_depth3_lr01
        n_estimators: 200
        max_depth: 3
        learning_rate: 0.1
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 1.0
        n_jobs: 1

  classification:
