      - name: xgb_clf_depth3_lr005
        n_estimators: 300
        max_depth: 3
        learning_rate: 0.05
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 1.0
        n_jobs: 1

      - name: xgb_clf_depth5_lr005
        n_estimators: 300
        max_depth: 5
        learning_rate: 0.05
        subsample: 0.9
