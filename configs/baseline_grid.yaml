        max_features: sqrt
        n_jobs: -1

      - name: rf_clf_regularized
        n_estimators: 300
        max_depth: 20
        min_samples_leaf: 2
        max_features: sqrt
        n_jobs: -1

      - name: rf_clf_shallow
        n_estimators: 200
